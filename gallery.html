<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141412;
    --paper:#f4f1e6;
    --frame:#1f1f1c;
    --accent:#5fd6c0;
    --accent-dim:#3a8c80;
    --grain:#232320;
    --mono: 'IBM Plex Mono', monospace;
    --serif: 'Fraunces', serif;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:var(--mono);
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Header ---------- */
  header{
    padding:56px 32px 28px;
    border-bottom:1px solid #333228;
  }

  .eyebrow{
    font-size:11px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 14px;
  }

  h1{
    font-family:var(--serif);
    font-weight:500;
    font-style:italic;
    font-size:clamp(2.2rem, 5vw, 3.6rem);
    margin:0 0 10px;
    letter-spacing:-0.01em;
  }

  header p{
    max-width:520px;
    color:#a9a698;
    font-size:13px;
    line-height:1.6;
    margin:0;
  }

  /* ---------- Filters ---------- */
  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:24px 32px;
  }

  .filters button{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    background:transparent;
    color:#8f8c7d;
    border:1px solid #35342a;
    padding:9px 16px;
    border-radius:999px;
    cursor:pointer;
    transition:border-color .25s ease, color .25s ease, background .25s ease;
  }

  .filters button:hover{
    color:var(--paper);
    border-color:var(--accent-dim);
  }

  .filters button.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#0c1211;
  }

  /* ---------- Gallery grid ---------- */
  .gallery{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:2px;
    padding:2px 2px 80px;
  }

  @media (max-width: 980px){
    .gallery{grid-template-columns:repeat(3, 1fr);}
  }
  @media (max-width: 640px){
    .gallery{grid-template-columns:repeat(2, 1fr);}
    header{padding:40px 20px 20px;}
    .filters{padding:18px 20px;}
  }

  .frame{
    position:relative;
    aspect-ratio:1/1;
    overflow:hidden;
    background:var(--grain);
    cursor:pointer;
    opacity:0;
    animation:fadeIn .5s ease forwards;
  }

  .frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    filter:grayscale(35%) contrast(1.02);
    transform:scale(1.001);
    transition:transform .6s cubic-bezier(.2,.7,.2,1), filter .5s ease;
  }

  .frame:hover img{
    transform:scale(1.08);
    filter:grayscale(0%) contrast(1.05);
  }

  .frame .tag{
    position:absolute;
    left:10px;
    bottom:10px;
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--paper);
    background:rgba(10,10,8,.55);
    padding:5px 9px;
    border-radius:3px;
    opacity:0;
    transform:translateY(6px);
    transition:opacity .3s ease, transform .3s ease;
  }

  .frame:hover .tag{opacity:1; transform:translateY(0);}

  .frame .no{
    position:absolute;
    top:10px;
    right:10px;
    font-size:10px;
    color:rgba(244,241,230,.55);
    letter-spacing:.05em;
  }

  .frame.hide{display:none;}

  @keyframes fadeIn{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }

  /* ---------- Lightbox ---------- */
  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(10,10,8,.94);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
    z-index:50;
  }

  .lightbox.open{opacity:1; pointer-events:auto;}

  .lightbox-inner{
    position:relative;
    width:min(84vw, 880px);
    max-height:82vh;
  }

  .lightbox img{
    width:100%;
    max-height:82vh;
    object-fit:contain;
    display:block;
    border:1px solid #35342a;
    opacity:0;
    transform:scale(.98);
    transition:opacity .35s ease, transform .35s ease;
  }

  .lightbox img.show{opacity:1; transform:scale(1);}

  .lightbox-caption{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#a9a698;
    margin-top:12px;
  }

  .lightbox-caption span.accent{color:var(--accent);}

  .lb-btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:1px solid #3a3a2f;
    color:var(--paper);
    width:44px;
    height:44px;
    border-radius:50%;
    font-size:18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .25s ease, border-color .25s ease;
  }
  .lb-btn:hover{background:var(--accent); color:#0c1211; border-color:var(--accent);}
  .lb-prev{left:-56px;}
  .lb-next{right:-56px;}

  @media (max-width:760px){
    .lb-prev{left:8px;}
    .lb-next{right:8px;}
  }

  .lb-close{
    position:absolute;
    top:-46px;
    right:0;
    background:none;
    border:none;
    color:#a9a698;
    font-size:13px;
    letter-spacing:.08em;
    text-transform:uppercase;
    cursor:pointer;
    font-family:var(--mono);
  }
  .lb-close:hover{color:var(--accent);}

  footer{
    padding:20px 32px 40px;
    color:#5f5d51;
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Priyanshu · Image Gallery</p>
  <h1>Image Sheet</h1>
  <p>A small gallery built with plain HTML, CSS and JavaScript. Filter by category, hover to preview, click a frame to open it full size.</p>
</header>

<nav class="filters" id="filters">
  <button data-filter="all" class="active">All</button>
  <button data-filter="nature">Nature</button>
  <button data-filter="urban">Urban</button>
  <button data-filter="portrait">Portrait</button>
  <button data-filter="abstract">Abstract</button>
</nav>

<section class="gallery" id="gallery"></section>

<footer>Task 1 — Image Gallery · HTML / CSS / JavaScript</footer>

<div class="lightbox" id="lightbox">
  <div class="lightbox-inner">
    <button class="lb-close" id="lbClose">Close ✕</button>
    <button class="lb-btn lb-prev" id="lbPrev">‹</button>
    <img id="lbImage" src="" alt="">
    <button class="lb-btn lb-next" id="lbNext">›</button>
    <div class="lightbox-caption">
      <span id="lbTitle">—</span>
      <span class="accent" id="lbCount">01 / 24</span>
    </div>
  </div>
</div>

<script>
  // ---------- Data ----------
  const categories = ['nature','urban','portrait','abstract'];
  const photos = Array.from({length: 24}, (_, i) => {
    const cat = categories[i % categories.length];
    return {
      id: i + 1,
      category: cat,
      title: cat.charAt(0).toUpperCase() + cat.slice(1) + ' · Image ' + String(i + 1).padStart(2,'0'),
      src: `https://picsum.photos/seed/gallery-${i+1}/700/700`
    };
  });

  // ---------- Render grid ----------
  const gallery = document.getElementById('gallery');

  function render() {
    gallery.innerHTML = photos.map((p, i) => `
      <div class="frame" data-category="${p.category}" data-index="${i}" style="animation-delay:${(i % 8) * 0.04}s">
        <img src="${p.src}" alt="${p.title}" loading="lazy">
        <span class="no">${String(p.id).padStart(2,'0')}</span>
        <span class="tag">${p.title}</span>
      </div>
    `).join('');
  }
  render();

  // ---------- Filters ----------
  const filterBtns = document.querySelectorAll('.filters button');
  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const filter = btn.dataset.filter;
      document.querySelectorAll('.frame').forEach(frame => {
        const match = filter === 'all' || frame.dataset.category === filter;
        frame.classList.toggle('hide', !match);
      });
    });
  });

  // ---------- Lightbox ----------
  const lightbox = document.getElementById('lightbox');
  const lbImage = document.getElementById('lbImage');
  const lbTitle = document.getElementById('lbTitle');
  const lbCount = document.getElementById('lbCount');
  let currentIndex = 0;

  function visiblePhotoIndices() {
    return Array.from(document.querySelectorAll('.frame'))
      .filter(f => !f.classList.contains('hide'))
      .map(f => parseInt(f.dataset.index, 10));
  }

  function openLightbox(index) {
    currentIndex = index;
    showPhoto();
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
  }

  function showPhoto() {
    const p = photos[currentIndex];
    lbImage.classList.remove('show');
    const img = new Image();
    img.onload = () => {
      lbImage.src = p.src;
      requestAnimationFrame(() => lbImage.classList.add('show'));
    };
    img.src = p.src;
    lbTitle.textContent = p.title;
    lbCount.textContent = String(p.id).padStart(2,'0') + ' / ' + photos.length;
  }

  function step(dir) {
    const visible = visiblePhotoIndices();
    if (visible.length === 0) return;
    const pos = visible.indexOf(currentIndex);
    const nextPos = (pos + dir + visible.length) % visible.length;
    currentIndex = visible[nextPos];
    showPhoto();
  }

  gallery.addEventListener('click', e => {
    const frame = e.target.closest('.frame');
    if (!frame) return;
    openLightbox(parseInt(frame.dataset.index, 10));
  });

  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbPrev').addEventListener('click', () => step(-1));
  document.getElementById('lbNext').addEventListener('click', () => step(1));

  lightbox.addEventListener('click', e => {
    if (e.target === lightbox) closeLightbox();
  });

  document.addEventListener('keydown', e => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });
</script>

</body>
</html>
